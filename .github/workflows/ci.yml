name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ${{ env.CLIPTATE_LOCAL_WORKSPACE || github.workspace }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !env.ACT }}
        with:
          persist-credentials: false
      - name: Inspect toolchain
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          fingerprint="$( { sw_vers -buildVersion; xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "cache-key=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Verify release automation
        run: python3 -m unittest discover -s Tests/Automation -v
      - name: Cache SwiftPM build and dependencies
        if: ${{ !env.ACT }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # This job only writes SwiftPM products to .build; never share it with signed packaging.
          path: .build
          key: swiftpm-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          # Reuse the latest build with the same toolchain and locked dependency graph.
          restore-keys: |
            swiftpm-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Resolve locked Swift packages
        run: swift package resolve --force-resolved-versions
      - name: Build library
        run: swift build
      - name: Verify dependency notices
        run: python3 scripts/update-dependency-notices.py --check
      - name: Run unit tests
        run: swift test
      - name: Verify login item queries with one cooperative worker
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        run: swift test --skip-build --filter LoginItemSettingsTests
      - name: Check dependency locks remain unchanged
        run: git diff --exit-code -- Package.resolved Cliptate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
