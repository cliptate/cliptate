name: Package and release

on:
  workflow_dispatch:
  schedule:
    # 03:17 Asia/Shanghai (UTC+8); avoid the busy start of the hour.
    - cron: '17 19 * * *'
  push:
    tags:
      - '**'
      - '!nightly'

permissions:
  contents: read

# Serialize updates to the rolling release, and reruns of the same version tag.
concurrency:
  group: package-${{ github.ref_type == 'tag' && github.ref_name != 'nightly' && github.ref_name || 'nightly' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CONFIGURATION: Release
      CLIPTATE_APP_STORE: 'NO'
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      release-tag: ${{ steps.source.outputs.release-tag }}
      dmg-name: ${{ steps.package.outputs.dmg-name }}
      artifact-ids: ${{ steps.upload-appcast.outputs.artifact-id != '' && format('{0},{1},{2}', steps.upload-dmg.outputs.artifact-id, steps.upload-checksum.outputs.artifact-id, steps.upload-appcast.outputs.artifact-id) || format('{0},{1}', steps.upload-dmg.outputs.artifact-id, steps.upload-checksum.outputs.artifact-id) }}
      signing-status: ${{ steps.notarize.outputs.signing-status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Nightly always packages main; stable releases preserve the triggering version tag.
          ref: ${{ github.ref_type == 'tag' && github.ref_name != 'nightly' && github.ref || 'main' }}
      - name: Identify release source
        id: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tag=nightly
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != nightly ]]; then
            tag="$REF_NAME"
          fi
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Inspect toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Install Developer ID certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/install-signing-keychain.sh
      - name: Resolve locked Swift packages
        run: swift package resolve --force-resolved-versions
      - name: Verify dependency notices
        run: python3 scripts/update-dependency-notices.py --check
      - name: Configure signed updates
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
        run: |
          python3 - <<'PY'
          import base64, os
          if os.environ["RELEASE_TAG"] != "nightly" and not os.environ["SPARKLE_PRIVATE_KEY"]:
              raise SystemExit("Configure secrets.SPARKLE_PRIVATE_KEY with the exported signing key")
          key = os.environ["SPARKLE_PUBLIC_KEY"]
          if len(base64.b64decode(key, validate=True)) != 32:
              raise SystemExit("Configure vars.SPARKLE_PUBLIC_KEY with a 32-byte public Ed25519 key")
          repository = os.environ["GITHUB_REPOSITORY"]
          feed = f"https://github.com/{repository}/releases/latest/download"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CLIPTATE_SPARKLE_PUBLIC_KEY={key}\n")
              output.write(f"CLIPTATE_UPDATE_FEED_URL={feed}/appcast.xml\n")
              # Monotonic across daily runs even when the marketing version is unchanged.
              build = 1000 + int(os.environ["GITHUB_RUN_NUMBER"])
              output.write(f"CURRENT_PROJECT_VERSION={build}.{os.environ['GITHUB_RUN_ATTEMPT']}\n")
          PY
      - name: Build macOS application
        env:
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: ./scripts/build-and-run.sh build
      - name: Check dependency locks remain unchanged
        run: git diff --exit-code -- Package.resolved Cliptate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Package and verify DMG
        id: package
        env:
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: ./scripts/package-dmg.sh
      - name: Notarize and staple DMG
        id: notarize
        timeout-minutes: 35
        env:
          DMG_PATH: ${{ steps.package.outputs.dmg-path }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.signing-keychain }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize-dmg.sh "$DMG_PATH"
      - name: Generate signed appcast
        if: ${{ steps.source.outputs.release-tag != 'nightly' }}
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
          BUILT_COMMIT: ${{ steps.source.outputs.commit }}
          SIGNING_STATUS: ${{ steps.notarize.outputs.signing-status }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/generate-appcast.sh "${{ steps.package.outputs.dmg-path }}"
      - name: Upload appcast
        if: ${{ steps.source.outputs.release-tag != 'nightly' }}
        id: upload-appcast
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/appcast.xml
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload DMG
        id: upload-dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.dmg-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload SHA-256 checksum
        id: upload-checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.checksum-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Remove signing keychain
        if: ${{ always() }}
        run: ./scripts/cleanup-signing-keychain.sh

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-ids }}
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
          DMG_NAME: ${{ needs.build.outputs.dmg-name }}
          SIGNING_STATUS: ${{ needs.build.outputs.signing-status }}
          APPCAST_PATH: ${{ needs.build.outputs.release-tag != 'nightly' && 'dist/appcast.xml' || '' }}
        run: ./scripts/publish-release.sh "dist/$DMG_NAME"
