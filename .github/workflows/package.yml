name: Package and release

on:
  workflow_dispatch:
  schedule:
    # 03:17 Asia/Shanghai (UTC+8); avoid the busy start of the hour.
    - cron: '17 19 * * *'
  push:
    tags:
      - '**'
      - '!nightly'

permissions:
  contents: read

# Serialize updates to the rolling release, and reruns of the same version tag.
# This bootstrap decision runs before repository scripts are available.
concurrency:
  group: package-${{ github.ref_type == 'tag' && github.ref_name != 'nightly' && github.ref_name || 'nightly' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CONFIGURATION: Release
      CLIPTATE_APP_STORE: 'NO'
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      release-tag: ${{ steps.source.outputs.release-tag }}
      appcast-path: ${{ steps.source.outputs.appcast-path }}
      dmg-name: ${{ steps.package.outputs.dmg-name }}
      artifact-ids: ${{ steps.upload-appcast.outputs.artifact-id != '' && format('{0},{1},{2}', steps.upload-dmg.outputs.artifact-id, steps.upload-checksum.outputs.artifact-id, steps.upload-appcast.outputs.artifact-id) || format('{0},{1}', steps.upload-dmg.outputs.artifact-id, steps.upload-checksum.outputs.artifact-id) }}
      signing-status: ${{ steps.notarize.outputs.signing-status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Nightly always packages main; stable releases preserve the triggering version tag.
          ref: ${{ github.ref_type == 'tag' && github.ref_name != 'nightly' && github.ref || 'main' }}
      - name: Identify release source
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/release-policy.py build --format github >> "$GITHUB_OUTPUT"
      - name: Verify version release notes
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
        run: python3 scripts/release-notes.py "$RELEASE_TAG" --check
      - name: Inspect toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Install Developer ID certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/install-signing-keychain.sh
      - name: Resolve locked Swift packages
        run: swift package resolve --force-resolved-versions
      - name: Verify dependency notices
        run: python3 scripts/update-dependency-notices.py --check
      - name: Configure signed updates
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
        run: python3 scripts/release-policy.py configure
      - name: Build macOS application
        env:
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: ./scripts/build-and-run.sh build
      - name: Check dependency locks remain unchanged
        run: git diff --exit-code -- Package.resolved Cliptate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Verify privacy identity across updates
        run: |
          previous_dmg="$RUNNER_TEMP/cliptate-previous-stable.dmg"
          status="$(curl --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 300 \
            --output "$previous_dmg" --write-out '%{http_code}' \
            https://github.com/cliptate/cliptate/releases/latest/download/Cliptate.dmg)"
          if [[ "$status" == 404 ]]; then
            echo 'No previous stable installer; skipping first-release identity comparison.'
          elif [[ "$status" == 200 ]]; then
            python3 scripts/verify-update-permission-identity.py "$previous_dmg" \
              .build/xcode/Build/Products/Release/Cliptate.app
          else
            echo "Cannot retrieve previous stable installer (HTTP $status)." >&2
            exit 1
          fi
      - name: Package and verify DMG
        id: package
        env:
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: ./scripts/package-dmg.sh
      - name: Notarize and staple DMG
        id: notarize
        timeout-minutes: 35
        env:
          DMG_PATH: ${{ steps.package.outputs.dmg-path }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.signing-keychain }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize-dmg.sh "$DMG_PATH"
      - name: Generate signed appcast
        if: ${{ steps.source.outputs.generate-appcast == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release-tag }}
          BUILT_COMMIT: ${{ steps.source.outputs.commit }}
          SIGNING_STATUS: ${{ steps.notarize.outputs.signing-status }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/generate-appcast.sh "${{ steps.package.outputs.dmg-path }}"
      - name: Upload appcast
        if: ${{ steps.source.outputs.generate-appcast == 'true' }}
        id: upload-appcast
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.source.outputs.appcast-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload DMG
        id: upload-dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.dmg-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload SHA-256 checksum
        id: upload-checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.checksum-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Remove signing keychain
        if: ${{ always() }}
        run: ./scripts/cleanup-signing-keychain.sh

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-ids }}
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
          DMG_NAME: ${{ needs.build.outputs.dmg-name }}
          SIGNING_STATUS: ${{ needs.build.outputs.signing-status }}
          APPCAST_PATH: ${{ needs.build.outputs.appcast-path }}
        run: ./scripts/publish-release.sh "dist/$DMG_NAME"
